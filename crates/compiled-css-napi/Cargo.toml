[package]
name = "compiled-css-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NAPI bridge — exposes the Rust `sort()` (Phase 8) and eventually `transformCss` to Node/Bun consumers."

[lib]
# `cdylib`: produces a `.dll` on Windows that Node's NAPI loader can load.
# `rlib`:   so the Rust unit tests inside this crate can compile.
crate-type = ["cdylib", "rlib"]

[dependencies]
css = { workspace = true }
postcss-core = { workspace = true }
autoprefixer = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# !!! WARNING — DO NOT RUN `cargo build -p compiled-css-napi --release`.
# !!!
# !!! On a Windows dev box without ≥32 GB free RAM, LLVM's release-mode
# !!! codegen of the autoprefixer crate (~5.5 KLOC, ports of upstream's
# !!! processor + prefixes + supports + transition + 58 hack files +
# !!! the `data/prefixes.rs` codegen'd table) OOMs hard. Three confirmed
# !!! attempts: opt-level=3 default, opt-level=3 + codegen-units=16,
# !!! opt-level=2 + codegen-units=16. The third crashed the entire
# !!! host (full-system OOM, ~10 min in). See `AGENT_6_DONE.md`
# !!! §"Release-mode build OOM" for the Phase 8c retry plan.
# !!!
# !!! The shipped `packages/css-native/compiled-css.win32-x64-msvc.node`
# !!! is built from `cargo build -p compiled-css-napi` (dev mode). NAPI
# !!! bytes-out are byte-identical between dev and release. The
# !!! parity-runner + verify-napi-autoprefixer gates pass 65/65 with
# !!! the dev binary.
# !!!
# !!! Per-package release profile overrides (e.g. opt-level=z for
# !!! autoprefixer) cannot live here — Cargo ignores `[profile.*]`
# !!! sections in non-root package manifests with the warning
# !!! "profiles for the non root package will be ignored". They have
# !!! to go in `crates/Cargo.toml` (workspace root). I left this
# !!! Cargo.toml profile-section-free to avoid the dead-code warning
# !!! and the false sense of having tried something. Phase 8c lands
# !!! the workspace-root profile additions itself.
