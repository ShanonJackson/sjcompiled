[package]
name = "compiled-css"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Local @sjcompiled/css plugins (atomicifyRules, discardEmptyRules, etc.) ported 1:1 from packages/css/src/plugins/"

[dependencies]
postcss-core = { workspace = true }
postcss-selector-parser = { workspace = true }
postcss-value-parser = { workspace = true }
postcss-values-parser = { workspace = true }
sjcompiled-utils = { workspace = true }
colord = { workspace = true }
indexmap = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
# Phase 6 — `normalize_css` orchestrator wraps the cssnano preset.
# `default_preset()` returns the 29-entry tuple list; this crate filters
# it to the 14 AFM hashing-path plugins and applies them in postcss
# lifecycle order (Once → walk → OnceExit).
cssnano-preset-default = { workspace = true }
