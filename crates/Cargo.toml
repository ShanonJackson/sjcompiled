[workspace]
resolver = "2"
members = [
    "postcss-core",
    "postcss-selector-parser",
    "postcss-value-parser",
    "postcss-values-parser",
    "fraction-js",
    "colord",
    "cssnano-utils",
    "caniuse-db",
    "caniuse-api",
    "browserslist-shim",
    "compiled-css",
    "css",
    "compiled-utils",
    "parity-runner",

    # Phase 5 — direct pipeline plugins (transformCss + sort entry points).
    "postcss-nested",
    "postcss-normalize-whitespace",
    "postcss-discard-duplicates",

    # Phase 6 — cssnano-preset-default sub-plugins (14 + orchestrator).
    "cssnano-postcss-discard-comments",
    "cssnano-postcss-normalize-string",
    "cssnano-postcss-normalize-positions",
    "cssnano-postcss-normalize-timing-functions",
    "cssnano-postcss-normalize-url",
    "cssnano-postcss-normalize-unicode",
    "cssnano-postcss-minify-selectors",
    "cssnano-postcss-minify-params",
    "cssnano-postcss-minify-gradients",
    "cssnano-postcss-ordered-values",
    "cssnano-postcss-reduce-initial",
    "cssnano-postcss-convert-values",
    "cssnano-postcss-colormin",
    "postcss-calc",
    "cssnano-preset-default",

    # Phase 7 — autoprefixer@10.4.14. Largest single port (~50 files).
    "autoprefixer",

    # Phase 8 — NAPI bridge. Exposes `sort()` (and eventually `transformCss`)
    # to Node/Bun so `packages/css/src/sort.ts` can delegate to the Rust
    # implementation behind a `COMPILED_CSS_ENGINE=rust` feature flag.
    "compiled-css-napi",

    # SWC plugins (plugins/PLAN.md). Compiled to wasm32-wasip1, ABI-compatible
    # with @swc/core@1.15.8 -> swc_core@54.0.0 (see PARITY_VERSIONS.md).
    "babel-plugin",
    "babel-plugin-strip-runtime",

    # Phase 0 sandbox / WASI / postcard / cache probes (PLAN.md §3.9.14).
    # Single probe plugin with dispatch on `mode` config. Not shipped.
    "babel-plugin-phase0-probes",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
indexmap = { version = "2", features = ["serde"] }
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc-browserslist = "3"
# Pure-Rust port of Sun's fdlibm. V8 ships its own fdlibm copy in
# `src/base/ieee754.cc`, so `libm::log` / `libm::pow` give bit-identical
# results to JS `Math.log` / `Math.pow` across every platform — unlike
# Rust's `f64::ln` / `f64::powf` which delegate to the system libm and
# differ between Windows / Linux / macOS.
libm = "0.2"

postcss-core = { path = "postcss-core" }
postcss-selector-parser = { path = "postcss-selector-parser" }
postcss-value-parser = { path = "postcss-value-parser" }
postcss-values-parser = { path = "postcss-values-parser" }
fraction-js = { path = "fraction-js" }
colord = { path = "colord" }
cssnano-utils = { path = "cssnano-utils" }
caniuse-db = { path = "caniuse-db" }
caniuse-api = { path = "caniuse-api" }
browserslist-shim = { path = "browserslist-shim" }
compiled-css = { path = "compiled-css" }
css = { path = "css" }
compiled-utils = { path = "compiled-utils" }
parity-runner = { path = "parity-runner" }

postcss-nested = { path = "postcss-nested" }
postcss-normalize-whitespace = { path = "postcss-normalize-whitespace" }
postcss-discard-duplicates = { path = "postcss-discard-duplicates" }
cssnano-postcss-discard-comments = { path = "cssnano-postcss-discard-comments" }
cssnano-postcss-normalize-string = { path = "cssnano-postcss-normalize-string" }
cssnano-postcss-normalize-positions = { path = "cssnano-postcss-normalize-positions" }
cssnano-postcss-normalize-timing-functions = { path = "cssnano-postcss-normalize-timing-functions" }
cssnano-postcss-normalize-url = { path = "cssnano-postcss-normalize-url" }
cssnano-postcss-normalize-unicode = { path = "cssnano-postcss-normalize-unicode" }
cssnano-postcss-minify-selectors = { path = "cssnano-postcss-minify-selectors" }
cssnano-postcss-minify-params = { path = "cssnano-postcss-minify-params" }
cssnano-postcss-minify-gradients = { path = "cssnano-postcss-minify-gradients" }
cssnano-postcss-ordered-values = { path = "cssnano-postcss-ordered-values" }
cssnano-postcss-reduce-initial = { path = "cssnano-postcss-reduce-initial" }
cssnano-postcss-convert-values = { path = "cssnano-postcss-convert-values" }
cssnano-postcss-colormin = { path = "cssnano-postcss-colormin" }
postcss-calc = { path = "postcss-calc" }
cssnano-preset-default = { path = "cssnano-preset-default" }
autoprefixer = { path = "autoprefixer" }

# Phase 8 NAPI bindings. Pinned napi-rs major. The `napi6` feature gates
# Node 10+ ABI — required for current Node LTS / Bun.
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
napi-build = "2"

# SWC plugin runtime. PIN — see crates/PARITY_VERSIONS.md.
# Bumping requires a coordinated @swc/core bump and full corpus re-run.
swc_core = { version = "=54.0.0", features = ["ecma_plugin_transform", "ecma_ast", "ecma_visit", "common"] }
babel-plugin = { path = "babel-plugin" }
babel-plugin-strip-runtime = { path = "babel-plugin-strip-runtime" }
postcard = { version = "1", features = ["alloc"] }

# Bench-friendly release profile. The user's global RUSTFLAGS sets
# `lto=thin` + `codegen-units=1` + `opt-level=3` which OOMs on this
# workspace (autoprefixer + cssnano-preset-default = huge LTO graph).
# Use this profile for `cargo run --example perf` etc. to get a
# representative-but-bounded build.
[profile.bench-fast]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16
debug = false
