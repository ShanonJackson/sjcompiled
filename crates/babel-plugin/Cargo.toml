[package]
name = "babel-plugin"
description = "Byte-for-byte port of @compiled/babel-plugin → SWC plugin (wasm32-wasip1). See plugins/PLAN.md."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cdylib`: produces a `.wasm` for SWC plugin loading.
# `rlib`:   so workspace integration tests compile against the visitor.
crate-type = ["cdylib", "rlib"]

[dependencies]
# §5.4e — `ecma_parser` is now a lib-level feature because
# `utils/resolve_binding.rs` parses imported modules at runtime
# (cross-file constant folding). Was dev-only at §4.2 / §4.4 when
# the visitor only walked already-parsed Programs; the §5.4e
# resolve-binding port reads `package.json`-resolved file paths,
# loads bytes via `std::fs`, and runs `parse_file_as_module` to
# get an AST to walk for the matching export. Adds parser surface
# to the WASI plugin binary; size impact verified clean against
# §5.4d's WASM build (no dependency cycle, parser was already
# loaded transitively via swc_ecma_visit).
swc_core = { workspace = true, features = ["ecma_parser"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
# §2.3 dispatcher consumes JSX pragma regexes + DEFAULT_IMPORT_SOURCES
# from compiled-utils. Path-dep (workspace) so version drift between
# the babel-plugin port and the utils crate is impossible.
compiled-utils = { path = "../compiled-utils" }
# §4.4 utils/manipulate_template_literal.rs ports two upstream regex
# patterns verbatim (the split-statement char class `[;|{|}]` and the
# block-comment strip `/\*(.|\n)*?\*/`). once_cell wraps them in
# `Lazy<Regex>` so compilation happens once per WASI instance.
regex = { workspace = true }
once_cell = { workspace = true }
# §4.4 utils/css_builders.rs imports `addUnitIfNeeded` and
# `cssAffixInterpolation` from `@compiled/css` upstream
# (packages/babel-plugin/src/utils/css-builders.ts:4). Both helpers
# are re-exported by `crates/css/src/lib.rs` per
# CSS_BUILDERS_DEPS.md's RESOLVED action item. Promoted from
# `[dev-dependencies]` (where §4.1 placed it for the integration
# parity test) to `[dependencies]` to land the §4.4 wiring.
css = { workspace = true }
# §5.3 cache.bin postcard wire format. Workspace pin at
# `crates/Cargo.toml` already carries `version = "1"` for
# strip-runtime's never-written use; lifting it here is additive
# (same major). PLAN.md §3.9.10 / SIDECAR_SCHEMA.md §3 lock the
# format itself.
postcard = { workspace = true }
# §5.4b — in-plugin module resolver. Replaces the host's
# `createDefaultResolver` per PLAN.md §1 constraint 2.
# Byte-parity contract with `enhanced-resolve@5.18.3` is
# `crates/babel-plugin/RESOLVER_MATRIX.md` + the corpus at
# `parity-harness/resolver-matrix/`.
oxc_resolver = { workspace = true }

[dev-dependencies]
# Phase 4 §4.2 — compat-generator parity gate needs to PARSE the
# fixture `input_source` strings into SWC AST nodes (Expr / Module
# with JSX). The lib build doesn't need the parser (the visitor walks
# already-parsed Programs), so `ecma_parser` is dev-only. Cargo's
# additive-feature unification means the lib build still ships
# without the parser surface.
#
# IMPORTANT: this re-declares `swc_core` to add ONE feature (`ecma_parser`)
# to the workspace-pinned set; the version pin (`=54.0.0`) MUST match
# the workspace dep at crates/Cargo.toml verbatim. `=54.0.0` is the
# ABI-paired version of `@swc/core@1.15.8` per `crates/PARITY_VERSIONS.md`.
# Bumping the @swc/core npm pin requires a coordinated `swc_core` bump
# AND full corpus re-run (PLAN.md §1 constraint 7).
swc_core = { version = "=54.0.0", features = ["ecma_plugin_transform", "ecma_ast", "ecma_visit", "common", "ecma_parser"] }

[package.metadata.swc]
# When bumped, update PARITY_VERSIONS.md AND re-run the corpus.
swc_core = "=54.0.0"
swc_core_bytes_compatible = "@swc/core@1.15.8"

# Build:    RUSTFLAGS="" cargo build -p babel-plugin --target wasm32-wasip1 --release
# Output:   crates/target/wasm32-wasip1/release/babel_plugin.wasm
# RUSTFLAGS="" is required: user-level RUSTFLAGS may include `-C lto=thin`
# which breaks proc-macro deps (swc_core pulls in many). Same pattern is
# used by crates/compiled-css-napi/.
