[package]
name = "autoprefixer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Byte-for-byte Rust port of autoprefixer@10.4.14. See crates/PARITY_VERSIONS.md."

[dependencies]
postcss-core.workspace = true
postcss-value-parser.workspace = true
browserslist-shim.workspace = true
caniuse-db.workspace = true
caniuse-api.workspace = true
fraction-js.workspace = true
sjcompiled-utils.workspace = true
indexmap.workspace = true
once_cell.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true

[build-dependencies]
# `preserve_order` is load-bearing — JS `Object.keys` iteration order
# reaches downstream prefix decisions, so the codegen must walk the JSON
# in source order. Without this feature, serde_json sorts keys
# alphabetically and the resulting `IndexMap` insertion order drifts.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Same `preserve_order` reason as build-dependencies — the parity test
# canonicalizes via recursive object-key sort on both sides, but the
# raw oracle JSON is parsed for the diff.
serde_json = { version = "1", features = ["preserve_order"] }

[features]
# Hand-rolled byte-equal substitutes for the WORD/SELECTOR regex shapes
# in `prefixer.rs::preprocess` (~93% of preprocess time per profile).
# Default OFF — flip to default ON only after parity-runner 337/337
# confirms byte-equality with the feature enabled.
#
# Enable from the workspace via `--features autoprefixer/fast-match` or
# from a downstream crate via its own forwarding feature.
fast-match = []
