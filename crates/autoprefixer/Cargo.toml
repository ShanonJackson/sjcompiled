[package]
name = "autoprefixer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Byte-for-byte Rust port of autoprefixer@10.4.14. See crates/PARITY_VERSIONS.md."

[dependencies]
postcss-core.workspace = true
postcss-value-parser.workspace = true
browserslist-shim.workspace = true
caniuse-db.workspace = true
caniuse-api.workspace = true
compiled-utils.workspace = true
indexmap.workspace = true
once_cell.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
# Folded-in `fraction.js` port (`src/fraction_js/`) calls into Sun fdlibm
# for `Math.log` / `Math.pow` to match V8's bit-identical results across
# platforms. See the comment on `libm` at the workspace root.
libm.workspace = true

[dev-dependencies]
# `preserve_order` is load-bearing for both `examples/regen_prefixes.rs`
# (JS `Object.keys` iteration order reaches downstream prefix decisions,
# so the codegen must walk the JSON in source order) and
# `tests/data_parity.rs` (canonicalizes via recursive object-key sort
# on both sides, but the raw oracle JSON is parsed for the diff).
serde_json = { version = "1", features = ["preserve_order"] }

# NOTE: `fast-match` was a feature flag during the byte-equality
# bring-up phase. It became the standard path on 2026-05-04 after
# parity-runner 65/65 (autoprefixer) + 30/30 (transform-css) byte-clean
# results plus the 20k-iter property-test suite (`tests/{fast,intrinsic}_match_parity.rs`)
# locked the matchers down. The regex::Regex fallback was removed
# along with the V1 precomputed snapshot — V2 is the only snapshot
# format and the hand-rolled matchers (`fast_match.rs::WordMatcher`,
# `SelectorMatcher`, `IntrinsicMatcher`) are the only matcher path.
# `regex` is still depended on by `resolution.rs` / `selector.rs`
# / `prefixer.rs` for non-hot-path matchers (e.g., the `:(-\w+-)`
# pseudo-prefix detector).
