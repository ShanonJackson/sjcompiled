[package]
name = "cssnano-preset-default"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Byte-for-byte Rust port of cssnano-preset-default@5.2.14 (orchestrator only — sub-plugins live in their own crates)."

[dependencies]
postcss-core = { workspace = true }
cssnano-postcss-discard-comments = { workspace = true }
cssnano-postcss-normalize-string = { workspace = true }
cssnano-postcss-normalize-positions = { workspace = true }
cssnano-postcss-normalize-timing-functions = { workspace = true }
cssnano-postcss-normalize-url = { workspace = true }
cssnano-postcss-normalize-unicode = { workspace = true }
cssnano-postcss-minify-selectors = { workspace = true }
cssnano-postcss-minify-params = { workspace = true }
cssnano-postcss-minify-gradients = { workspace = true }
cssnano-postcss-ordered-values = { workspace = true }
cssnano-postcss-reduce-initial = { workspace = true }
cssnano-postcss-convert-values = { workspace = true }
cssnano-postcss-colormin = { workspace = true }
postcss-calc = { workspace = true }
