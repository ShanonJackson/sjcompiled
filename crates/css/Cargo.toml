[package]
name = "css"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rust port of @sjcompiled/css orchestrators (transformCss + sort) — packages/css/src/{transform,sort}.ts"

[dependencies]
postcss-core = { workspace = true }
postcss-selector-parser = { workspace = true }
postcss-value-parser = { workspace = true }
postcss-values-parser = { workspace = true }
# `postcss-nested@5.0.6`, `postcss-normalize-whitespace@5.1.1`,
# `autoprefixer@10.4.14`, `cssnano-preset-default@5.2.14`: NOT yet
# declared as path-deps because those crates are still scaffolds.
# Phase 5a/5b/6/7 will add them as `transform.rs` consumes them.
postcss-discard-duplicates = { workspace = true }
compiled-css = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
