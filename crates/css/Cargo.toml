[package]
name = "css"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rust port of @compiled/css orchestrators (transformCss + sort) — packages/css/src/{transform,sort}.ts"

[dependencies]
postcss-core = { workspace = true }
postcss-selector-parser = { workspace = true }
postcss-value-parser = { workspace = true }
postcss-values-parser = { workspace = true }
postcss-discard-duplicates = { workspace = true }
# Phase 8b — full transformCss pipeline. The 12-plugin composition wires
# in postcss-nested@5.0.6, cssnano-preset-default@5.2.14, autoprefixer@10.4.14,
# postcss-normalize-whitespace@5.1.1, plus the local plugins under
# `compiled-css`. See `crates/PHASE_8B_LIFECYCLE_AUDIT.md` for the lifecycle
# round-by-round recipe.
postcss-nested = { workspace = true }
postcss-normalize-whitespace = { workspace = true }
autoprefixer = { workspace = true }
cssnano-preset-default = { workspace = true }
cssnano-browserslist-snapshot = { workspace = true }
compiled-utils = { workspace = true }
compiled-css = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
