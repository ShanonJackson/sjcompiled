[package]
name = "colord"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Byte-for-byte Rust port of colord@2.9.1"

[features]
# `random()` is excluded from the parity build because it is not on the
# hashing path and producing non-deterministic bytes would break parity.
random = []

[dependencies]
once_cell = { workspace = true }
regex = { workspace = true }
indexmap = { workspace = true }
